name: 发布

# 打 tag（v0.1.0 这种）→ 构建 → 建 Release。
# 也可以在 Actions 页面手动跑：只构建、传 artifact，不发版（方便先验证流程）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 要写权限

env:
  # 资产文件名必须**跨版本稳定**：静态下载页用的是
  #   https://github.com/<owner>/<repo>/releases/latest/download/VoxKey-macos-arm64.zip
  # 这个固定跳转；名字里带版本号的话，每次发版链接就废了。
  ASSET: VoxKey-macos-arm64.zip

jobs:
  macos:
    # 必须用 arm64 的 runner：spec 里锁了 target_arch=arm64，
    # 在 x86 的 macos-13 上跑不出 arm64 包。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 冒烟自检（不加载模型）
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          .venv/bin/python -m pip install -q -e '.[tools]'
          PYTHONPATH=src .venv/bin/python tools/smoke.py --no-model

      - name: 版本号（tag 去掉开头的 v）
        if: github.ref_type == 'tag'
        run: echo "VOXKEY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 证书是可选的：没配就出未签名包（能装，但用户要手动放行一次）。
      # 判断全放在 shell 里做——`if:` 里引用 secrets/env 的上下文规则容易踩坑，
      # 而且 macOS runner 默认是 bash 3.2，空数组展开会报 unbound variable，所以不用数组。
      - name: 构建 .app（有证书就顺带签名 + 公证）
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          SIGN_FLAG=""
          NOTARIZE_FLAG=""

          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            echo "==> 导入签名证书"
            KEYCHAIN=build.keychain
            echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
            security create-keychain -p "" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            security import /tmp/cert.p12 -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            # 没有这条，codesign 会弹权限框，在 CI 上表现为一直卡到超时
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
            rm -f /tmp/cert.p12

            # 身份全名从 keychain 里查，比让人在 secret 里再抄一份不容易写错
            VOXKEY_SIGN_IDENTITY="$(security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
            [ -n "$VOXKEY_SIGN_IDENTITY" ] || { echo "keychain 里没有 Developer ID Application 身份"; exit 1; }
            export VOXKEY_SIGN_IDENTITY
            SIGN_FLAG="--sign"

            if [ -n "${APPLE_APP_PASSWORD:-}" ]; then
              echo "==> 准备公证凭据"
              xcrun notarytool store-credentials voxkey-ci \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
              export VOXKEY_NOTARY_PROFILE=voxkey-ci
              NOTARIZE_FLAG="--notarize"
            fi
          else
            echo "==> 没配签名证书，出未签名包"
          fi

          packaging/build_macos.sh $SIGN_FLAG $NOTARIZE_FLAG

      - name: 校验产物
        run: |
          set -euo pipefail
          APP=packaging/dist/VoxKey.app
          test -d "$APP"
          # 这两个都是**运行时才加载**的库，不在依赖图里：缺了就是「能启动、一用就崩」
          test -f "$APP/Contents/Frameworks/_sounddevice_data/portaudio-binaries/libportaudio.dylib"
          test -f "$APP/Contents/Frameworks/libsherpa-onnx-c-api.dylib"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist" >/dev/null
          echo "==> 包大小"
          du -sh "$APP"
          echo "==> 校验和"
          shasum -a 256 "packaging/dist/$ASSET" | tee /tmp/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VoxKey-macos-arm64
          path: packaging/dist/${{ env.ASSET }}

      - name: 建 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "macOS（Apple 芯片）安装包。"
            echo
            echo '```'
            cat /tmp/sha256.txt
            echo '```'
            echo
            echo "- 首次打开会自动下载识别模型（约 800MB），下载完就能用"
            echo "- 识别全部在本机完成，音频不上传"
            echo "- 需要授权：麦克风、辅助功能（上屏）、输入监控（读设备按键）"
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" "packaging/dist/$ASSET" \
            --title "VoxKey $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md
