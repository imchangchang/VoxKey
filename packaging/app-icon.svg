<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 960" width="360" height="960">
  <!-- 外框：竖长圆角矩形 -->
  <rect x="32" y="22" width="296" height="916" rx="36" ry="36"
        fill="none" stroke="#000000" stroke-width="10"/>

  <!-- 顶部扬声器开孔：两边短、中间长的6条竖线 -->
  <rect x="62"  y="60" width="12" height="38" rx="6" ry="6" fill="#000000"/>
  <rect x="104" y="50" width="12" height="56" rx="6" ry="6" fill="#000000"/>
  <rect x="146" y="50" width="12" height="56" rx="6" ry="6" fill="#000000"/>
  <rect x="188" y="50" width="12" height="56" rx="6" ry="6" fill="#000000"/>
  <rect x="230" y="50" width="12" height="56" rx="6" ry="6" fill="#000000"/>
  <rect x="272" y="60" width="12" height="38" rx="6" ry="6" fill="#000000"/>

  <!-- 中间导航圆盘：放大，左右间距小 -->
  <circle cx="180" cy="250" r="130"
          fill="none" stroke="#000000" stroke-width="10"/>

  <!-- 按钮1：方形套圆形 -->
  <rect x="105" y="410" width="150" height="150"
        fill="none" stroke="#000000" stroke-width="10"/>
  <circle cx="180" cy="485" r="46"
          fill="none" stroke="#000000" stroke-width="10"/>

  <!-- 按钮2：方形套圆形 -->
  <rect x="105" y="585" width="150" height="150"
        fill="none" stroke="#000000" stroke-width="10"/>
  <circle cx="180" cy="660" r="46"
          fill="none" stroke="#000000" stroke-width="10"/>

  <!-- 按钮3：方形套圆形 -->
  <rect x="105" y="760" width="150" height="150"
        fill="none" stroke="#000000" stroke-width="10"/>
  <circle cx="180" cy="835" r="46"
          fill="none" stroke="#000000" stroke-width="10"/>
</svg>
